services:
  isk:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${ISK_BIND_ADDR:-127.0.0.1}:${ISK_PORT:-8000}:8000"
    environment:
      OZON_FBO_DATA_DIR: /data
      ISK_ALLOWED_HOSTS: "${ISK_ALLOWED_HOSTS:-127.0.0.1,localhost,testserver}"
      ISK_ALLOWED_ORIGINS: "${ISK_ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}"
      ISK_SECURE_COOKIE: "${ISK_SECURE_COOKIE:-true}"
      ISK_ENCRYPTION_KEY_FILE: /run/secrets/isk_encryption_key
      WB_DESTINATION: "${WB_DESTINATION:-1259570991}"
    secrets:
      - isk_encryption_key
    volumes:
      - isk_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/status',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
volumes:
  isk_data:
secrets:
  isk_encryption_key:
    file: ./secrets/isk_encryption_key
