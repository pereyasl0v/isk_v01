name: Validate ISK and marketplace calculators
on:
  push:
    branches:
      - feature/ozon-digitization
  pull_request:
    branches:
      - feature/ozon-digitization
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --test src/market/*.test.mjs
        working-directory: frontend
      - run: node --test src/sales-chart-range.test.mjs
        working-directory: frontend
      - run: node --test src/shipment-status-summary.test.mjs
        working-directory: frontend
      - run: node --test src/ozon-retry-status.test.mjs
        working-directory: frontend
      - run: node --test src/accountMarketplace.test.mjs
        working-directory: frontend
      - run: node --test src/digitization-period.test.mjs
        working-directory: frontend
      - run: node --test src/state-polling.test.mjs
        working-directory: frontend
      - run: node --test src/inventory-capitalization.test.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --check extension/wb-capture/wb-capture.js && node --check extension/ozon-capture/ozon-capture.js
      - run: python -c "import json; [json.load(open(p)) for p in ['extension/wb-capture/manifest.json','extension/ozon-capture/manifest.json']]"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t isk-unified:ci .

  publish:
    name: Publish ready-to-run VPS image
    if: github.event_name == 'push'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish only after all checks pass
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pereyasl0v/isk_v01:stable
            ghcr.io/pereyasl0v/isk_v01:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
