name: Validate ISK and marketplace calculators
on:
  push:
    branches:
      - feature/ozon-digitization
  pull_request:
    branches:
      - feature/ozon-digitization
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: sh -n deploy/auto-update.sh deploy/request-update.sh && bash -n deploy/install-auto-deploy.sh
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --test src/market/*.test.mjs
        working-directory: frontend
      - run: node --test src/sales-chart-range.test.mjs
        working-directory: frontend
      - run: node --test src/shipment-status-summary.test.mjs
        working-directory: frontend
      - run: node --test src/ozon-retry-status.test.mjs
        working-directory: frontend
      - run: node --test src/accountMarketplace.test.mjs
        working-directory: frontend
      - run: node --test src/digitization-period.test.mjs
        working-directory: frontend
      - run: node --test src/digitization-comparison.test.mjs
        working-directory: frontend
      - run: node --test src/state-polling.test.mjs
        working-directory: frontend
      - run: node --test src/inventory-capitalization.test.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --check extension/wb-capture/wb-capture.js && node --check extension/ozon-capture/ozon-capture.js
      - run: python -c "import json; [json.load(open(p)) for p in ['extension/wb-capture/manifest.json','extension/ozon-capture/manifest.json']]"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t isk-unified:ci .

  publish:
    name: Publish ready-to-run VPS image
    if: github.event_name != 'pull_request'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish only after all checks pass
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pereyasl0v/isk_v01:stable
            ghcr.io/pereyasl0v/isk_v01:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Queue safe VPS update
    if: github.event_name != 'pull_request'
    needs: [publish]
    runs-on: ubuntu-latest
    concurrency:
      group: isk-vps-deploy
      cancel-in-progress: false
    steps:
      - name: Request deployment over restricted SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ISK_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ISK_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.ISK_DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SSH_PRIVATE_KEY" || -z "$SSH_KNOWN_HOSTS" || -z "$DEPLOY_HOST" ]]; then
            echo "Auto deploy not configured. Set ISK_DEPLOY_SSH_KEY, ISK_DEPLOY_KNOWN_HOSTS and ISK_DEPLOY_HOST."
            exit 0
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/isk_actions
          chmod 0600 ~/.ssh/isk_actions
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/isk_actions -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "deploy@$DEPLOY_HOST" 'sudo -n /usr/local/sbin/isk-request-update'
